# Gradle properties (committed)
#
# The actual keystore password and other secrets should be placed in
# android/local.properties (which is .gitignored). This file may contain
# non-secret defaults that apply when local.properties is missing.
#
# Required in local.properties (or environment):
#   SPEEDSHARE_RELEASE_STORE_FILE=keystore/speedshare-release.jks
#   SPEEDSHARE_RELEASE_STORE_PASSWORD=<your store password>
#   SPEEDSHARE_RELEASE_KEY_ALIAS=speedshare
#   SPEEDSHARE_RELEASE_KEY_PASSWORD=<your key password>

# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
